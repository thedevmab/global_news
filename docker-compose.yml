services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gvn
      POSTGRES_PASSWORD: gvn_dev_password
      POSTGRES_DB: gvn
    ports:
      - "5435:5432"
    volumes:
      - gvn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gvn -d gvn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gvn_pgdata:
